<!doctype html>

<html lang="en">

<head>
	<title>Gwent Classic from The Witcher 3: Wild Hunt</title>
	<meta charset="utf-8" />
	<meta name="author" content="Arun Sundaram" />
	<meta name="description" content="Play the original Gwent minigame from The Witcher 3 in your browser! Includes cards from Hearts of Stone and Blood & Wine!" />
	<meta name="keywords" content="arun, sundaram, programmer, gwent, tw3, witcher, card, game, gamedev, play" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="stylesheet" type="text/css" href="style.css" />
<link rel="stylesheet" href="tavern.css">
</head>

<body>

<div id="dimensions" style="position:fixed;width:100vw;height:calc(100vw * 1080 / 1920);"></div>



<main tabindex="-1">

	<section id="click-background" class="noclick"></section>

	<section id="panel-left" class="panel">

		<div id="exit-game" data-title="Exit game"></div>
	
		<div id="leader-op" class="leader-box">
			<div class="leader-container center" data-title="View leader"> 
			</div>
			<div class="leader-active">
				<div></div>
			</div>
		</div>
		
		<section id="stats-op" class="stats">
			<div class="profile-img">
				<div><div></div></div>
			</div>
			
			<div id="name-op" class="name">Opponent</div>
			<div id="deck-name-op" class="deck-name"></div>
			
			<div id="hand-count-op" class="hand-count">6</div>
			
			<div id="gem1-op" class="gem gem-on bg-contain"></div>
			<div id="gem2-op" class="gem gem-on bg-contain"></div>
			
			<div id="score-total-op" class="score-total"><div class="center">0</div></div>
			
			<div id="passed-op">Passed</div>
			
		</section>
		
		<div id="weather" class="card-container">
		</div>
		
		<section id="stats-me" class="stats">
			<div class="profile-img">
				<div><div></div></div>
			</div>
			<div id="passed-me">Passed</div>
			<div id="hand-count-me" class="hand-count">5</div>
			
			<div id="gem1-me" class="gem gem-on bg-contain"></div>
			<div id="gem2-me" class="gem gem-on bg-contain"></div>
			
			<div id="name-me" class="name"></div>
			<div id="deck-name-me" class="deck-name"></div>
			
			<div id="score-total-me" class="score-total"><div class="center">0</div></div>
			
			
		</section>
		
		<div id="leader-me" class="leader-box">
			<div class="leader-container center" data-title="Play leader (X)"></div>
			<div class="leader-active">
				<div></div>
			</div>
		</div>
		
		<div id="pass-button" class="center" data-title="Pass round (Space)">Pass</div>
		
	</section>
	
	<section id="panel-mid" class="panel">
		<section id="field-op" class="field">
			<div class="field-row" data-row="siege">
				<div class="row-score center">0</div>
				<div class="row-special card-container"></div>
				<div class="row-cards card-container"></div>
				<div class="row-weather"></div>
			</div>
			<div class="field-row" data-row="ranged">
				<div class="row-score center">0</div>
				<div class="row-special card-container"></div>
				<div class="row-cards card-container"></div>
				<div class="row-weather"></div>
			</div>
			<div class="field-row" data-row="close">
				<div class="row-score center">0</div>
				<div class="row-special card-container"></div>
				<div class="row-cards card-container"></div>
				<div class="row-weather"></div>
			</div>
		</section>
		
		<section id="field-me" class="field">
			<div class="field-row" data-row="close">
				<div class="row-score center">0</div>
				<div class="row-special card-container"></div>
				<div class="row-cards card-container"></div>
				<div class="row-weather"></div>
			</div>
			<div class="field-row" data-row="ranged">
				<div class="row-score center">0</div>
				<div class="row-special card-container"></div>
				<div class="row-cards card-container"></div>
				<div class="row-weather"></div>
			</div>
			<div class="field-row" data-row="siege">
				<div class="row-score center">0</div>
				<div class="row-special card-container"></div>
				<div class="row-cards card-container"></div>
				<div class="row-weather"></div>
			</div>
		</section>
		
		<section id="field-hand">
			<div id="hand-row" class="card-container card-selectable">
			</div>
		</section>
	</section>
	
	<section id="panel-right" class="panel">
		<div id="grave-op" class="grave cardpile" data-title="View discards">
		</div>
		<div id="deck-op" class="cardpile">
		
		</div>
		<div id="grave-me" class="grave cardpile" data-title="View discards">
		</div>
		<div id="deck-me" class="cardpile">
		</div>
	</section>
	
	<div id="hand-op"></div>
	
	<section class="card-preview hide">
		<div class="card-lg"></div>
		<div class="card-description">
			<div></div>
			<h1></h1>
			<p></p>
		</div>
	</section>
	
	<section id="carousel" class="hide">
		<div class="carousel-cards">
			<button type="button" class="card-lg" onclick="Carousel.curr?.shift(-2)"></button>
			<button type="button" class="card-lg" onclick="Carousel.curr?.shift(-1)"></button>
			<button type="button" class="card-lg" onclick="Carousel.curr?.select(event)"></button>
			<button type="button" class="card-lg" onclick="Carousel.curr?.shift(1)"></button>
			<button type="button" class="card-lg" onclick="Carousel.curr?.shift(2)"></button>
		</div>
		<div class="card-description">
			<div></div>
			<h1></h1>
			<p></p>
		</div>
		<div></div>
		<div class="carousel-controls">
			<button type="button" class="carousel-prev" onclick="Carousel.curr?.shift(-1)">‹ Previous</button>
			<span class="carousel-position" aria-live="polite"></span>
			<button type="button" class="carousel-next" onclick="Carousel.curr?.shift(1)">Next ›</button>
			<button type="button" class="finish-redraw" onclick="Carousel.curr?.cancel()">Done</button>
		</div>
	</section>
	
	
	<section id="popup" class="center hide">
		<div>
			<h3></h3>
			<p></p>
			<div>
				<button onclick="Popup.curr.selectYes()"></button>
				<button onclick="Popup.curr.selectNo()"></button>
			</div>
		</div>
	</section>
	
	
	<section id="notification-bar" class="hide">
		<div></div>
	</section>
	
	<section id="end-screen" class="hide">
		<div></div>
		<table>
			<colgroup>
				<col span="3" />
				<col span="1" />
				<col span="1" />
				<col span="1" />
			</colgroup>
			<tbody>
				<tr>
					<th colspan="2"></th>
					<th>Round 1</th>
					<th>Round 2</th>
					<th>Round 3</th>
				</tr>
				<tr>
					<th colspan="2">Geralt</th>
					<td>0</td>
					<td>0</td>
					<td>0</td>
				</tr>
				<tr>
					<th colspan="2">Opponent</th>
					<td>0</td>
					<td>0</td>
					<td>0</td>
				</tr>
			</tbody>
		</table>
		<p class="hide">Both players lost their final gem. Play a rematch or choose a new deck.</p>
		<div id="match-reward" aria-live="polite"></div>
		<button>Main Menu</button>
		<button>Rematch</button>
		<button>New Game</button>
	</section>
	
	<section id="deck-selector">
		
	</section>
	

</main>

<section id="deck-customization" class="tavern"></section>
<dialog id="detail"><div id="detail-content"></div></dialog>
<dialog id="victory-reward" aria-labelledby="reward-heading"><h2 id="reward-heading">Choose your victory reward</h2><div id="reward-options"></div></dialog>
<button hidden id="battle-settings" aria-label="Settings" title="Settings">⚙</button>

<script type="text/javascript" src="common.js"></script>
<script type="text/javascript" src="cards.js"></script>
<script type="text/javascript" src="decks.js"></script>
<script type="text/javascript" src="abilities.js"></script>
<script type="text/javascript" src="factions.js"></script>
<script src="collection.js"></script>
<script src="lan.js"></script>
<script src="lan-board.js"></script>
<script src="tavern.js"></script>
<script type="text/javascript" src="gwent.js"></script>
</body>

</html>
